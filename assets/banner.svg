<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g filter="url(#b)" opacity=".55">
    <circle cx="200" cy="80" r="90" fill="#38bdf8"><animate attributeName="cx" values="200;420;200" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="230" r="110" fill="#818cf8"><animate attributeName="cy" values="230;60;230" dur="11s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
      <text x="600" y="150" font-size="84" font-weight="800" fill="url(#ac)">repobrief</text>
    </g>
    <text x="600" y="205" font-size="26" fill="#cbd5e1">Pack any repo into one LLM-ready file</text>
  </g>
  <rect x="450" y="234" width="300" height="4" rx="2" fill="url(#ac)"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></rect>
</svg>
